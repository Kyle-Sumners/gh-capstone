name: Deployment

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write


jobs:
  dev:
    runs-on: ubuntu-latest
    name: Deploy to dev
    environment: dev
    steps:
      - uses: actions/checkout@v7
      - name: Show environment name
        run: |
          echo "Environment: ${{ vars.ENV_NAME }}"
      
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm identity
        run: az account show
  staging:
    runs-on: ubuntu-latest
    name: Deploy to staging
    environment: staging
    needs: dev
    steps:
      - uses: actions/checkout@v7
      - name: Show environment name
        run: | 
          echo "Environment: ${{ vars.ENV_NAME }}"
  prod:
    runs-on: ubuntu-latest
    name: Deploy to prod
    environment: prod
    needs: staging
    steps:
      - uses: actions/checkout@v7
      - name: Show environment name
        run: |
          echo "Environment: ${{ vars.ENV_NAME }}"
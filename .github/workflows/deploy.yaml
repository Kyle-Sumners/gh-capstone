name: Deployment

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write


jobs:
  dev:
    runs-on: ubuntu-latest
    name: Deploy to dev
    environment: dev
    defaults:
      run:
        working-directory: envs/dev
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false
      
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      
      - name: Terraform initialization
        run: terraform init -input=false
      
      - name: Terraform apply
        run: terraform apply -auto-approve -input=false
      
      - name: Capture Terraform outputs
        id: tf
        run: |
          echo "rg=$(terraform output -raw resource_group_name)" >> $GITHUB_OUTPUT
          echo "app=$(terraform output -raw web_app_name)" >> $GITHUB_OUTPUT

      - name: Package app
        run: cd "$GITHUB_WORKSPACE/app" && zip -r "$GITHUB_WORKSPACE/app.zip" .

      - name: Deploy app content
        run: |
          az webapp deploy \
            --resource-group "${{ steps.tf.outputs.rg }}" \
            --name "${{ steps.tf.outputs.app }}" \
            --src-path "$GITHUB_WORKSPACE/app.zip" \
            --type zip

      - name: Show app URL
        run: terraform output -raw app_url

      - name: Test URL
        run: |
            URL=${terraform output -raw app_url}
            curl --fail --silent --show-error --retry 5 --retry-delay 5 "$URL" | grep -q "<h1>"
      
  staging:
    runs-on: ubuntu-latest
    name: Deploy to staging
    environment: staging
    needs: dev
    defaults:
      run:
        working-directory: envs/staging
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform initialization
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false

      - name: Capture Terraform outputs
        id: tf
        run: |
          echo "rg=$(terraform output -raw resource_group_name)" >> $GITHUB_OUTPUT
          echo "app=$(terraform output -raw web_app_name)" >> $GITHUB_OUTPUT

      - name: Package app
        run: cd "$GITHUB_WORKSPACE/app" && zip -r "$GITHUB_WORKSPACE/app.zip" .

      - name: Deploy app content
        run: |
          az webapp deploy \
            --resource-group "${{ steps.tf.outputs.rg }}" \
            --name "${{ steps.tf.outputs.app }}" \
            --src-path "$GITHUB_WORKSPACE/app.zip" \
            --type zip

      - name: Show app URL
        run: terraform output -raw app_url
      
      - name: Test URL
        run: |
            URL=${terraform output -raw app_url}
            curl --fail --silent --show-error --retry 5 --retry-delay 5 "$URL" | grep -q "<h1>"
  
  prod:
    runs-on: ubuntu-latest
    name: Deploy to prod
    environment: prod
    needs: staging
    defaults:
      run:
        working-directory: envs/prod
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform initialization
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false
      
      - name: Capture Terraform outputs
        id: tf
        run: |
          echo "rg=$(terraform output -raw resource_group_name)" >> $GITHUB_OUTPUT
          echo "app=$(terraform output -raw web_app_name)" >> $GITHUB_OUTPUT

      - name: Package app
        run: cd "$GITHUB_WORKSPACE/app" && zip -r "$GITHUB_WORKSPACE/app.zip" .

      - name: Deploy app content
        run: |
          az webapp deploy \
            --resource-group "${{ steps.tf.outputs.rg }}" \
            --name "${{ steps.tf.outputs.app }}" \
            --src-path "$GITHUB_WORKSPACE/app.zip" \
            --type zip

      - name: Show app URL
        run: terraform output -raw app_url
      
      - name: Test URL
        run: |
            URL=${terraform output -raw app_url}
            curl --fail --silent --show-error --retry 5 --retry-delay 5 "$URL" | grep -q "<h1>"